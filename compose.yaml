name: orderflow

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - orderflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://orderflow:local-development-only@database:5432/orderflow
      LOG_LEVEL: info
      API_PORT: 3000
    depends_on:
      database:
        condition: service_healthy
    networks: [edge, data]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://orderflow:local-development-only@database:5432/orderflow
      LOG_LEVEL: info
      WORKER_HEALTH_PORT: 3001
      WORKER_POLL_INTERVAL_MS: 1000
      WORKER_PROCESSING_DELAY_MS: 1500
    depends_on:
      database:
        condition: service_healthy
    networks: [data]
    restart: unless-stopped

  web:
    build:
      context: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks: [edge]
    restart: unless-stopped

networks:
  edge:
  data:
    internal: true

volumes:
  orderflow-data:
