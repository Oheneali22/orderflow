<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beacon Support Desk</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">BEACON OPERATIONS</p>
      <h1>Support Desk</h1>
      <p class="subtitle">Report an issue, track progress, and keep services moving.</p>
    </div>
    <span id="api-status" class="status">Checking API…</span>
  </header>

  <main>
    <section class="stats" aria-label="Ticket statistics">
      <article><strong id="total">0</strong><span>Total tickets</span></article>
      <article><strong id="open">0</strong><span>Open</span></article>
      <article><strong id="resolved">0</strong><span>Resolved</span></article>
      <article><strong id="critical">0</strong><span>Critical</span></article>
    </section>

    <section class="workspace">
      <article class="panel">
        <h2>Create a ticket</h2>
        <form id="ticket-form">
          <label>Title<input name="title" required maxlength="160" placeholder="What needs attention?"></label>
          <label>Description<textarea name="description" required rows="5" placeholder="Describe the symptoms and impact"></textarea></label>
          <label>Email<input name="requester_email" type="email" required placeholder="you@example.com"></label>
          <label>Priority
            <select name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="critical">Critical</option>
            </select>
          </label>
          <button type="submit">Submit ticket</button>
          <p id="form-message" role="status"></p>
        </form>
      </article>

      <article class="panel tickets-panel">
        <div class="panel-heading">
          <h2>Recent tickets</h2>
          <button id="refresh" class="secondary">Refresh</button>
        </div>
        <div id="tickets" class="ticket-list"></div>
      </article>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
