apiVersion: apps/v1
kind: Deployment

metadata:
  name: orderflow-worker
  namespace: {{ .Release.Namespace }}

spec:
  replicas: {{ .Values.worker.replicaCount }}

  selector:
    matchLabels:
      app: orderflow-worker

  template:
    metadata:
      labels:
        app: orderflow-worker

    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}

      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}

          envFrom:
            - configMapRef:
                name: orderflow-config

          env:
            - name: DB_USERNAME_FILE
              value: /mnt/secrets/db-username

            - name: DB_PASSWORD_FILE
              value: /mnt/secrets/db-password

            - name: NODE_EXTRA_CA_CERTS
              value: /etc/rds-ca/us-east-1-bundle.pem

          ports:
            - name: health
              containerPort: {{ .Values.config.workerHealthPort }}

          readinessProbe:
            httpGet:
              path: /health/ready
              port: health

          livenessProbe:
            httpGet:
              path: /health/live
              port: health

          resources:
            requests:
              cpu: {{ .Values.worker.resources.requests.cpu | quote }}
              memory: {{ .Values.worker.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.worker.resources.limits.cpu | quote }}
              memory: {{ .Values.worker.resources.limits.memory | quote }}

          volumeMounts:
            - name: rds-secrets
              mountPath: /mnt/secrets
              readOnly: true

            - name: rds-ca
              mountPath: /etc/rds-ca
              readOnly: true

      volumes:
        - name: rds-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: orderflow-rds

        - name: rds-ca
          configMap:
            name: orderflow-rds-ca