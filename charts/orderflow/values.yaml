global:
  imageRegistry: ""
  imagePullSecrets: []
  imageTag: ""

web:
  replicaCount: 2
  image:
    repository: orderflow-web
    digest: ""
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

api:
  replicaCount: 2
  image:
    repository: orderflow-api
    digest: ""
    pullPolicy: IfNotPresent
  service:
    port: 3000
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

worker:
  replicaCount: 2
  image:
    repository: orderflow-worker
    digest: ""
    pullPolicy: IfNotPresent
  service:
    port: 3001
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }

database:
  existingSecret: orderflow-database
  secretKey: DATABASE_URL

externalSecret:
  enabled: false
  region: us-east-1
  remoteKey: orderflow-production/database-url

config:
  logLevel: info
  workerPollIntervalMs: 1000
  workerProcessingDelayMs: 1500

ingress:
  enabled: false
  className: nginx
  host: orderflow.example.com
  annotations: {}
  tls: []

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s

developmentPostgresql:
  enabled: false
  image: postgres:16-alpine
  database: orderflow
  username: orderflow
  password: local-development-only
