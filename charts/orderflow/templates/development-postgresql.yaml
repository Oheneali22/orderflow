{{- if .Values.developmentPostgresql.enabled }}
apiVersion: v1
kind: Secret
metadata: { name: {{ .Release.Name }}-development-postgresql }
type: Opaque
stringData:
  DATABASE_URL: postgresql://{{ .Values.developmentPostgresql.username }}:{{ .Values.developmentPostgresql.password }}@{{ .Release.Name }}-postgresql:5432/{{ .Values.developmentPostgresql.database }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: {{ .Release.Name }}-postgresql }
spec:
  serviceName: {{ .Release.Name }}-postgresql
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/component: postgresql } }
  template:
    metadata: { labels: { app.kubernetes.io/component: postgresql } }
    spec:
      containers:
        - name: postgresql
          image: {{ .Values.developmentPostgresql.image }}
          env:
            - { name: POSTGRES_DB, value: {{ .Values.developmentPostgresql.database }} }
            - { name: POSTGRES_USER, value: {{ .Values.developmentPostgresql.username }} }
            - { name: POSTGRES_PASSWORD, value: {{ .Values.developmentPostgresql.password }} }
          ports: [{ name: postgresql, containerPort: 5432 }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", {{ .Values.developmentPostgresql.username }}] }, initialDelaySeconds: 5 }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-postgresql }
spec:
  selector: { app.kubernetes.io/component: postgresql }
  ports: [{ name: postgresql, port: 5432 }]
{{- end }}
