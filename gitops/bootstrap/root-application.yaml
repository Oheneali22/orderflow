apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orderflow-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Oheneali22/orderflow.git
    targetRevision: main
    path: gitops/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
