apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: orderflow-aws-secrets-manager
  namespace: monitoring
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: orderflow-aws-secrets-manager
    kind: SecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: orderflow-production/grafana-admin
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: orderflow-production/grafana-admin
        property: admin-password
