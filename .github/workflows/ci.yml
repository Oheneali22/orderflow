name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: orderflow_test
          POSTGRES_USER: orderflow
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderflow -d orderflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://orderflow:test-only-password@localhost:5432/orderflow_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build-and-push:
    name: Build and Push Images
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::942909611186:role/GitHubActionsOrderFlowRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          EXISTING_TAG=$(aws ecr batch-get-image \
            --repository-name orderflow-api \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'images[0].imageId.imageTag' \
            --output text 2>/dev/null || true)

          if [ "$EXISTING_TAG" = "$IMAGE_TAG" ]; then
            echo "API image $IMAGE_TAG already exists."
            echo "Reusing existing immutable image."
          else
            echo "API image does not exist. Building..."

            docker build \
              -f Dockerfile.api \
              -t "$REGISTRY/orderflow-api:$IMAGE_TAG" \
              .

            docker push "$REGISTRY/orderflow-api:$IMAGE_TAG"
          fi

      - name: Build and push Worker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          EXISTING_TAG=$(aws ecr batch-get-image \
            --repository-name orderflow-worker \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'images[0].imageId.imageTag' \
            --output text 2>/dev/null || true)

          if [ "$EXISTING_TAG" = "$IMAGE_TAG" ]; then
            echo "Worker image $IMAGE_TAG already exists."
            echo "Reusing existing immutable image."
          else
            echo "Worker image does not exist. Building..."

            docker build \
              -f Dockerfile.worker \
              -t "$REGISTRY/orderflow-worker:$IMAGE_TAG" \
              .

            docker push "$REGISTRY/orderflow-worker:$IMAGE_TAG"
          fi

  deploy:
    name: Deploy to EKS
    needs: build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER: orderflow-dev
      NAMESPACE: orderflow
      RELEASE_NAME: orderflow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::942909611186:role/GitHubActionsOrderFlowRole
          aws-region: us-east-1

      - name: Configure Kubernetes access
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Verify Kubernetes authorization
        run: |
          kubectl auth can-i get deployments -n "$NAMESPACE"
          kubectl auth can-i create jobs.batch -n "$NAMESPACE"

      - name: Run database migration
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::12}"
          MIGRATION_JOB="orderflow-db-migration-${SHORT_SHA}"

          echo "Migration job: $MIGRATION_JOB"

          kubectl delete job "$MIGRATION_JOB" \
            -n "$NAMESPACE" \
            --ignore-not-found=true

          helm template "$RELEASE_NAME" helm/orderflow \
            --namespace "$NAMESPACE" \
            --set migration.enabled=true \
            --set api.image.tag="$GITHUB_SHA" \
            --set worker.image.tag="$GITHUB_SHA" \
            --show-only templates/migration-job.yaml \
            | kubectl apply -f -

          if ! kubectl wait \
            --for=condition=complete \
            "job/$MIGRATION_JOB" \
            -n "$NAMESPACE" \
            --timeout=5m; then

            echo "Migration failed."

            kubectl describe job "$MIGRATION_JOB" \
              -n "$NAMESPACE"

            kubectl logs \
              "job/$MIGRATION_JOB" \
              -n "$NAMESPACE" || true

            exit 1
          fi

          echo "Database migration completed successfully."

      - name: Deploy application with Helm
        run: |
          helm upgrade --install "$RELEASE_NAME" helm/orderflow \
            --namespace "$NAMESPACE" \
            --set migration.enabled=false \
            --set api.image.tag="$GITHUB_SHA" \
            --set worker.image.tag="$GITHUB_SHA" \
            --atomic \
            --wait \
            --timeout 10m

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/orderflow-api \
            -n "$NAMESPACE" \
            --timeout=5m

          kubectl rollout status deployment/orderflow-worker \
            -n "$NAMESPACE" \
            --timeout=5m

          echo "Running workloads:"
          kubectl get pods -n "$NAMESPACE"

          echo "Deployed API image:"
          kubectl get deployment orderflow-api \
            -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

          echo "Deployed Worker image:"
          kubectl get deployment orderflow-worker \
            -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'